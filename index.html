<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b12"><title>GifForge — Make a GIF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#141826;--muted:#aab2c5;--accent:#9c7cff;--border:#ffffff1a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 15%,#9c7cff30,transparent 28%),var(--bg);color:#f6f7fb;font:15px system-ui,sans-serif}.top{height:66px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.brand{font-size:1.3rem;font-weight:900}.brand span{color:var(--accent)}button{border:0;border-radius:8px;padding:10px 13px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button.secondary{background:#1b2033;border:1px solid var(--border)}button:disabled{opacity:.5}.layout{display:grid;grid-template-columns:260px 1fr 250px;min-height:calc(100vh - 66px)}aside,main{padding:18px}aside{border-right:1px solid var(--border)}aside:last-child{border:0;border-left:1px solid var(--border)}.title{color:var(--muted);font-size:.77rem;letter-spacing:.1em;text-transform:uppercase;margin:4px 0 13px;font-weight:800}.control{display:grid;gap:6px;margin-bottom:13px}.control label{color:var(--muted);font-size:.85rem}input,textarea{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:inherit}input[type=color]{height:40px;padding:3px}textarea{min-height:65px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{width:100%}.stage{min-height:450px;display:grid;place-items:center;border:1px solid var(--border);border-radius:15px;overflow:hidden;background:#151824;background-image:linear-gradient(45deg,#202331 25%,transparent 25%),linear-gradient(-45deg,#202331 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#202331 75%),linear-gradient(-45deg,transparent 75%,#202331 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}#canvas{max-width:100%;max-height:70vh;background:white;box-shadow:0 20px 50px #0008;touch-action:none;cursor:default}#canvas.dragging{cursor:grabbing}.frames{display:flex;gap:8px;overflow:auto;padding:12px 0}.frame{padding:0;width:76px;height:76px;flex:none;background:#111;border:2px solid transparent;overflow:hidden}.frame.active{border-color:var(--accent)}.frame canvas{width:100%;height:100%}.preview{min-height:180px;display:grid;place-items:center;border:1px solid var(--border);border-radius:10px;background:#090a10;color:var(--muted);margin:10px 0;overflow:hidden}.preview img{max-width:100%;max-height:300px}.status,.hint{color:var(--muted);font-size:.85rem;min-height:22px}@media(max-width:900px){.layout{grid-template-columns:220px 1fr}.layout aside:last-child{grid-column:1/-1;border-left:0;border-top:1px solid var(--border)}}@media(max-width:620px){.layout{display:flex;flex-direction:column}.layout aside{border:0;border-bottom:1px solid var(--border)}.layout aside:last-child{border-top:0}}
</style>
</head>
<body>
<header class="top"><div class="brand">Gif<span>Forge</span></div><button id="render">Render GIF</button></header>
<div class="layout">
<aside><div class="title">Canvas</div><div class="row"><div class="control"><label for="width">Width</label><input id="width" type="number" min="80" max="800" value="500"></div><div class="control"><label for="height">Height</label><input id="height" type="number" min="80" max="800" value="500"></div></div><div class="control"><label for="background">Background</label><input id="background" type="color" value="#6c5ce7"></div><div class="control"><label for="upload">Add image</label><input id="upload" type="file" accept="image/*"></div><div class="title">Caption</div><div class="control"><label for="caption">Text</label><textarea id="caption" placeholder="Type a caption"></textarea></div><div class="row"><div class="control"><label for="textColor">Color</label><input id="textColor" type="color" value="#ffffff"></div><div class="control"><label for="textSize">Size</label><input id="textSize" type="number" min="10" max="180" value="56"></div></div><button id="addText" class="secondary full">Add caption</button></aside>
<main><div class="stage"><canvas id="canvas" width="500" height="500" aria-label="Canvas. Drag the caption to move it."></canvas></div><div id="frames" class="frames" aria-label="Animation frames"></div><div class="hint">Add a caption, then drag it on the canvas to move it.</div></main>
<aside><div class="title">Animation</div><div class="control"><label for="delay">Frame delay (ms)</label><input id="delay" type="number" min="50" max="3000" value="250"></div><button id="addFrame" class="full">Add frame</button><div class="row" style="margin-top:9px"><button id="duplicate" class="secondary">Duplicate</button><button id="delete" class="secondary">Delete</button></div><div class="title" style="margin-top:20px">Preview</div><div id="preview" class="preview">Render a GIF to preview it</div><a id="download" class="secondary full" href="#" download="gifforge.gif" style="display:block;text-align:center;padding:10px;border-radius:8px;text-decoration:none;pointer-events:none;opacity:.5">Download GIF</a><p id="status" class="status" role="status" aria-live="polite"></p></aside>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),base=document.createElement('canvas'),baseCtx=base.getContext('2d'),framesEl=$('frames'),status=$('status');
base.width=canvas.width;base.height=canvas.height;let frames=[],current=0,outputUrl=null,dragging=false,dragOffset={x:0,y:0};
function makeCaption(){return null}function drawCaption(target,caption){if(!caption)return;const c=target.getContext('2d');c.save();c.fillStyle=caption.color;c.textAlign='center';c.textBaseline='middle';c.font=`900 ${caption.size}px system-ui, sans-serif`;c.shadowColor='rgba(0,0,0,.65)';c.shadowBlur=7;c.shadowOffsetY=3;c.fillText(caption.text,caption.x,caption.y,target.width-24);c.restore()}
function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(base,0,0);drawCaption(canvas,frames[current]?.caption)}function save(){if(frames.length)frames[current].src=base.toDataURL('image/png')}
function loadImage(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}
async function show(n){if(!frames[n])return;const i=await loadImage(frames[n].src);baseCtx.clearRect(0,0,base.width,base.height);baseCtx.drawImage(i,0,0,base.width,base.height);redraw()}
function thumbs(){framesEl.replaceChildren();frames.forEach((frame,n)=>{const b=document.createElement('button');b.type='button';b.className='frame'+(n===current?' active':'');b.setAttribute('aria-label',`Edit frame ${n+1}`);const t=document.createElement('canvas');t.width=t.height=76;const tc=t.getContext('2d'),i=new Image();i.onload=()=>{tc.drawImage(i,0,0,76,76);drawCaption(t,frame.caption)};i.src=frame.src;b.append(t);b.onclick=async()=>{save();current=n;await show(n);thumbs()};framesEl.append(b)})}
function addFrame(){save();if(!frames.length){frames.push({src:base.toDataURL('image/png'),caption:null});current=0}else{frames.splice(current+1,0,{src:base.toDataURL('image/png'),caption:frames[current].caption?{...frames[current].caption}:null});current++}redraw();thumbs()}
$('addFrame').onclick=addFrame;$('duplicate').onclick=()=>{if(!frames.length)return addFrame();save();frames.splice(current+1,0,{src:frames[current].src,caption:frames[current].caption?{...frames[current].caption}:null});current++;show(current);thumbs()};$('delete').onclick=async()=>{if(!frames.length)return;frames.splice(current,1);current=Math.max(0,Math.min(current,frames.length-1));if(frames.length)await show(current);else{baseCtx.clearRect(0,0,base.width,base.height);baseCtx.fillStyle=$('background').value;baseCtx.fillRect(0,0,base.width,base.height);redraw()}thumbs()};
$('background').oninput=()=>{baseCtx.fillStyle=$('background').value;baseCtx.fillRect(0,0,base.width,base.height);save();redraw();thumbs()};$('upload').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const i=await loadImage(r.result);baseCtx.drawImage(i,0,0,base.width,base.height);if(!frames.length)frames.push({src:base.toDataURL('image/png'),caption:null});save();redraw();thumbs()}catch{status.textContent='Could not load that image.'}};r.readAsDataURL(f);e.target.value=''};
$('addText').onclick=()=>{const text=$('caption').value.trim();if(!text){status.textContent='Type a caption first.';return}if(!frames.length)frames.push({src:base.toDataURL('image/png'),caption:null});frames[current].caption={text,x:canvas.width/2,y:canvas.height/2,color:$('textColor').value,size:Math.max(10,Math.min(180,Number($('textSize').value)||56))};redraw();thumbs();status.textContent='Caption added. Drag it on the canvas to move it.'};
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}function hit(p,caption){ctx.save();ctx.font=`900 ${caption.size}px system-ui, sans-serif`;const w=Math.min(ctx.measureText(caption.text).width,canvas.width-24),h=caption.size*1.35;ctx.restore();return Math.abs(p.x-caption.x)<=w/2+12&&Math.abs(p.y-caption.y)<=h/2+10}
canvas.addEventListener('pointerdown',e=>{const cap=frames[current]?.caption;if(!cap)return;const p=point(e);if(!hit(p,cap))return;dragging=true;dragOffset={x:cap.x-p.x,y:cap.y-p.y};canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId);e.preventDefault()});canvas.addEventListener('pointermove',e=>{const cap=frames[current]?.caption;if(!dragging||!cap)return;const p=point(e);cap.x=Math.max(0,Math.min(canvas.width,p.x+dragOffset.x));cap.y=Math.max(0,Math.min(canvas.height,p.y+dragOffset.y));redraw()});function stopDrag(){if(!dragging)return;dragging=false;canvas.classList.remove('dragging');save();thumbs()}canvas.addEventListener('pointerup',stopDrag);canvas.addEventListener('pointercancel',stopDrag);
$('width').onchange=$('height').onchange=async()=>{save();const old=base.toDataURL('image/png'),w=Math.max(80,Math.min(800,Number($('width').value)||500)),h=Math.max(80,Math.min(800,Number($('height').value)||500));canvas.width=w;canvas.height=h;base.width=w;base.height=h;const i=await loadImage(old);baseCtx.drawImage(i,0,0,w,h);if(frames[current]?.caption){frames[current].caption.x=w/2;frames[current].caption.y=h/2}save();redraw();thumbs()};
$('render').onclick=async()=>{save();if(!frames.length)addFrame();if(!window.GIF){status.textContent='GIF encoder failed to load. Reload the page.';return}const button=$('render');button.disabled=true;status.textContent='Rendering GIF…';try{if(outputUrl)URL.revokeObjectURL(outputUrl);const g=new GIF({workers:2,quality:10,width:canvas.width,height:canvas.height,workerScript:'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'});for(const frame of frames){const i=await loadImage(frame.src),composite=document.createElement('canvas');composite.width=canvas.width;composite.height=canvas.height;composite.getContext('2d').drawImage(i,0,0);drawCaption(composite,frame.caption);g.addFrame(composite,{copy:true,delay:Math.max(50,Math.min(3000,Number($('delay').value)||250))})}g.on('finished',blob=>{outputUrl=URL.createObjectURL(blob);const im=new Image();im.src=outputUrl;im.alt='Generated GIF';$('preview').replaceChildren(im);const d=$('download');d.href=outputUrl;d.style.pointerEvents='auto';d.style.opacity=1;status.textContent='GIF ready!';button.disabled=false});g.render()}catch(error){status.textContent='Could not render GIF. Try smaller frames.';button.disabled=false}};
baseCtx.fillStyle=$('background').value;baseCtx.fillRect(0,0,base.width,base.height);frames.push({src:base.toDataURL('image/png'),caption:null});redraw();thumbs();
})();
</script>
</body>
</html>
