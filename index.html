<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GifForge — Make a GIF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#141826;--muted:#aab2c5;--accent:#9c7cff;--border:#ffffff1a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 15%,#9c7cff30,transparent 28%),var(--bg);color:#f6f7fb;font:15px system-ui,sans-serif}.top{height:66px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.brand{font-size:1.3rem;font-weight:900}.brand span{color:var(--accent)}button{border:0;border-radius:8px;padding:10px 13px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button.secondary{background:#1b2033;border:1px solid var(--border)}button:disabled{opacity:.5}.layout{display:grid;grid-template-columns:260px 1fr 250px;min-height:calc(100vh - 66px)}aside,main{padding:18px}aside{border-right:1px solid var(--border)}aside:last-child{border:0;border-left:1px solid var(--border)}.title{color:var(--muted);font-size:.77rem;letter-spacing:.1em;text-transform:uppercase;margin:4px 0 13px;font-weight:800}.control{display:grid;gap:6px;margin-bottom:13px}.control label{color:var(--muted);font-size:.85rem}input,textarea{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:inherit}input[type=color]{height:40px;padding:3px}textarea{min-height:65px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{width:100%}.stage{min-height:450px;display:grid;place-items:center;border:1px solid var(--border);border-radius:15px;overflow:hidden;background:#151824;background-image:linear-gradient(45deg,#202331 25%,transparent 25%),linear-gradient(-45deg,#202331 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#202331 75%),linear-gradient(-45deg,transparent 75%,#202331 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}#canvas{max-width:100%;max-height:70vh;background:white;box-shadow:0 20px 50px #0008}.frames{display:flex;gap:8px;overflow:auto;padding:12px 0}.frame{padding:0;width:76px;height:76px;flex:none;background:#111;border:2px solid transparent;overflow:hidden}.frame.active{border-color:var(--accent)}.frame canvas{width:100%;height:100%}.preview{min-height:180px;display:grid;place-items:center;border:1px solid var(--border);border-radius:10px;background:#090a10;color:var(--muted);margin:10px 0;overflow:hidden}.preview img{max-width:100%;max-height:300px}.status,.hint{color:var(--muted);font-size:.85rem;min-height:22px}@media(max-width:900px){.layout{grid-template-columns:220px 1fr}.layout aside:last-child{grid-column:1/-1;border-left:0;border-top:1px solid var(--border)}}@media(max-width:620px){.layout{display:flex;flex-direction:column}.layout aside{border:0;border-bottom:1px solid var(--border)}.layout aside:last-child{border-top:0}}
</style>
</head>
<body>
<header class="top"><div class="brand">Gif<span>Forge</span></div><button id="render">Render GIF</button></header>
<div class="layout"><aside><div class="title">Canvas</div><div class="row"><div class="control"><label>Width</label><input id="width" type="number" min="80" max="800" value="500"></div><div class="control"><label>Height</label><input id="height" type="number" min="80" max="800" value="500"></div></div><div class="control"><label>Background</label><input id="background" type="color" value="#6c5ce7"></div><div class="control"><label>Add image</label><input id="upload" type="file" accept="image/*"></div><div class="title">Caption</div><div class="control"><label>Text</label><textarea id="caption" placeholder="Type a caption"></textarea></div><div class="row"><div class="control"><label>Color</label><input id="textColor" type="color" value="#ffffff"></div><div class="control"><label>Size</label><input id="textSize" type="number" min="10" max="180" value="56"></div></div><button id="addText" class="secondary full">Add caption</button></aside><main><div class="stage"><canvas id="canvas" width="500" height="500"></canvas></div><div id="frames" class="frames"></div><div class="hint">Click a frame to edit it.</div></main><aside><div class="title">Animation</div><div class="control"><label>Frame delay (ms)</label><input id="delay" type="number" min="50" max="3000" value="250"></div><button id="addFrame" class="full">Add frame</button><div class="row" style="margin-top:9px"><button id="duplicate" class="secondary">Duplicate</button><button id="delete" class="secondary">Delete</button></div><div class="title" style="margin-top:20px">Preview</div><div id="preview" class="preview">Render a GIF to preview it</div><a id="download" class="secondary full" href="#" download="gifforge.gif" style="display:block;text-align:center;padding:10px;border-radius:8px;text-decoration:none;pointer-events:none;opacity:.5">Download GIF</a><p id="status" class="status"></p></aside></div>
<script>
(()=>{const $=id=>document.getElementById(id),c=$('canvas'),x=c.getContext('2d'),framesEl=$('frames'),status=$('status');let frames=[],current=0,url=null;
function bg(){x.fillStyle=$('background').value;x.fillRect(0,0,c.width,c.height)}function snap(){return c.toDataURL('image/png')}function save(){if(frames.length)frames[current]=snap()}function image(src){return new Promise((ok,no)=>{let i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=src})}async function show(n){if(frames[n]){let i=await image(frames[n]);x.clearRect(0,0,c.width,c.height);x.drawImage(i,0,0)}}function thumbs(){framesEl.replaceChildren();frames.forEach((src,n)=>{let b=document.createElement('button');b.className='frame'+(n===current?' active':'');let t=document.createElement('canvas');t.width=t.height=76;let i=new Image;i.onload=()=>t.getContext('2d').drawImage(i,0,0,76,76);i.src=src;b.append(t);b.onclick=async()=>{save();current=n;await show(n);thumbs()};framesEl.append(b)})}function add(){save();if(!frames.length){bg();frames.push(snap());current=0}else{frames.splice(current+1,0,snap());current++}thumbs()}
$('addFrame').onclick=add;$('duplicate').onclick=()=>{if(!frames.length)return add();save();frames.splice(current+1,0,frames[current]);current++;show(current);thumbs()};$('delete').onclick=async()=>{if(!frames.length)return;frames.splice(current,1);current=Math.max(0,Math.min(current,frames.length-1));if(frames.length)await show(current);else bg();thumbs()};
$('background').oninput=()=>{bg();save();thumbs()};$('upload').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=async()=>{let i=await image(r.result);x.drawImage(i,0,0,c.width,c.height);if(!frames.length)frames.push(snap());else save();thumbs()};r.readAsDataURL(f);e.target.value=''};$('addText').onclick=()=>{let text=$('caption').value.trim();if(!text)return status.textContent='Type a caption first.';if(!frames.length){bg();frames.push(snap())}x.save();x.fillStyle=$('textColor').value;x.textAlign='center';x.textBaseline='middle';x.font=`900 ${Number($('textSize').value)||56}px system-ui`;x.shadowColor='#0009';x.shadowBlur=7;x.fillText(text,c.width/2,c.height/2,c.width-24);x.restore();save();thumbs()};
$('width').onchange=$('height').onchange=async()=>{save();let old=frames[current];c.width=Math.max(80,Math.min(800,Number($('width').value)||500));c.height=Math.max(80,Math.min(800,Number($('height').value)||500));bg();if(old){let i=await image(old);x.drawImage(i,0,0,c.width,c.height);save()}thumbs()};
$('render').onclick=async()=>{save();if(!frames.length)add();if(!window.GIF)return status.textContent='GIF encoder failed to load. Reload the page.';let button=$('render');button.disabled=true;status.textContent='Rendering GIF…';try{if(url)URL.revokeObjectURL(url);let g=new GIF({workers:2,quality:10,width:c.width,height:c.height,workerScript:'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'});for(let src of frames)g.addFrame(await image(src),{copy:true,delay:Number($('delay').value)||250});g.on('finished',blob=>{url=URL.createObjectURL(blob);let im=new Image;im.src=url;im.alt='Generated GIF';$('preview').replaceChildren(im);let d=$('download');d.href=url;d.style.pointerEvents='auto';d.style.opacity=1;status.textContent='GIF ready!';button.disabled=false});g.render()}catch(e){status.textContent='Could not render GIF. Try smaller frames.';button.disabled=false}};bg();frames.push(snap());thumbs()})();
</script></body></html>
