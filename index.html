<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>GifForge — Make a GIF</title><script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#141826;--muted:#aab2c5;--accent:#9c7cff;--border:#ffffff1a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 15%,#9c7cff30,transparent 28%),var(--bg);color:#f6f7fb;font:15px system-ui,sans-serif}.top{height:66px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.brand{font-size:1.3rem;font-weight:900}.brand span{color:var(--accent)}button{border:0;border-radius:8px;padding:10px 13px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button.secondary{background:#1b2033;border:1px solid var(--border)}button:disabled{opacity:.5}.layout{display:grid;grid-template-columns:260px 1fr 250px;min-height:calc(100vh - 66px)}aside,main{padding:18px}aside{border-right:1px solid var(--border)}aside:last-child{border:0;border-left:1px solid var(--border)}.title{color:var(--muted);font-size:.77rem;letter-spacing:.1em;text-transform:uppercase;margin:4px 0 13px;font-weight:800}.control{display:grid;gap:6px;margin-bottom:13px}.control label{color:var(--muted);font-size:.85rem}input,textarea{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:inherit}input[type=color]{height:40px;padding:3px}input[type=range]{padding:0;accent-color:var(--accent)}textarea{min-height:65px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{width:100%}.stage{min-height:450px;display:grid;place-items:center;border:1px solid var(--border);border-radius:15px;overflow:hidden;background:#151824;background-image:linear-gradient(45deg,#202331 25%,transparent 25%),linear-gradient(-45deg,#202331 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#202331 75%),linear-gradient(-45deg,transparent 75%,#202331 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}#canvas{max-width:100%;max-height:70vh;background:white;box-shadow:0 20px 50px #0008;touch-action:none;cursor:grab}#canvas.dragging{cursor:grabbing}.frames{display:flex;gap:8px;overflow:auto;padding:12px 0}.frame{padding:0;width:76px;height:76px;flex:none;background:#111;border:2px solid transparent;overflow:hidden}.frame.active{border-color:var(--accent)}.frame canvas{width:100%;height:100%}.preview{min-height:180px;display:grid;place-items:center;border:1px solid var(--border);border-radius:10px;background:#090a10;color:var(--muted);margin:10px 0;overflow:hidden}.preview img{max-width:100%;max-height:300px}.status,.hint{color:var(--muted);font-size:.85rem;min-height:22px}.value{float:right;color:#fff}@media(max-width:900px){.layout{grid-template-columns:220px 1fr}.layout aside:last-child{grid-column:1/-1;border-left:0;border-top:1px solid var(--border)}}@media(max-width:620px){.layout{display:flex;flex-direction:column}.layout aside{border:0;border-bottom:1px solid var(--border)}.layout aside:last-child{border-top:0}}
</style></head><body>
<header class="top"><div class="brand">Gif<span>Forge</span></div><button id="render">Render GIF</button></header><div class="layout">
<aside><div class="title">Canvas</div><div class="row"><div class="control"><label for="width">Width</label><input id="width" type="number" min="80" max="800" value="500"></div><div class="control"><label for="height">Height</label><input id="height" type="number" min="80" max="800" value="500"></div></div><div class="control"><label for="background">Background</label><input id="background" type="color" value="#6c5ce7"></div><div class="control"><label for="upload">Add image</label><input id="upload" type="file" accept="image/*"></div><div id="imageTools" hidden><div class="title">Selected image</div><div class="control"><label for="imageSize">Size <span class="value" id="sizeValue">100%</span></label><input id="imageSize" type="range" min="25" max="300" value="100"></div><div class="control"><label for="imageCrop">Crop / zoom <span class="value" id="cropValue">100%</span></label><input id="imageCrop" type="range" min="100" max="300" value="100"></div><div class="row"><button id="resetImage" class="secondary">Reset</button><button id="removeImage" class="secondary">Remove</button></div><p class="hint">Drag the image on the canvas. Zoom crops toward its center; anything outside the canvas is cropped.</p></div><div class="title">Caption</div><div class="control"><label for="caption">Text</label><textarea id="caption" placeholder="Type a caption"></textarea></div><div class="row"><div class="control"><label for="textColor">Color</label><input id="textColor" type="color" value="#ffffff"></div><div class="control"><label for="textSize">Size</label><input id="textSize" type="number" min="10" max="180" value="56"></div></div><button id="addText" class="secondary full">Add caption</button></aside>
<main><div class="stage"><canvas id="canvas" width="500" height="500" aria-label="Canvas. Drag images or captions to move them."></canvas></div><div id="frames" class="frames" aria-label="Animation frames"></div><div class="hint">Drag an image or caption to move it. Use image sliders to resize or crop.</div></main>
<aside><div class="title">Animation</div><div class="control"><label for="delay">Frame delay (ms)</label><input id="delay" type="number" min="50" max="3000" value="250"></div><button id="addFrame" class="full">Add frame</button><div class="row" style="margin-top:9px"><button id="duplicate" class="secondary">Duplicate</button><button id="delete" class="secondary">Delete</button></div><div class="title" style="margin-top:20px">Preview</div><div id="preview" class="preview">Render a GIF to preview it</div><a id="download" class="secondary full" href="#" download="gifforge.gif" style="display:block;text-align:center;padding:10px;border-radius:8px;text-decoration:none;pointer-events:none;opacity:.5">Download GIF</a><p id="status" class="status" role="status" aria-live="polite"></p></aside></div>
<script>
(()=>{const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),base=document.createElement('canvas'),bc=base.getContext('2d'),framesEl=$('frames'),status=$('status');base.width=canvas.width;base.height=canvas.height;let frames=[],current=0,out=null,drag=null,photoImage=null;
function freshFrame(){return{src:base.toDataURL('image/png'),photo:null,caption:null}}function paintCaption(target,cap){if(!cap)return;const c=target.getContext('2d');c.save();c.fillStyle=cap.color;c.textAlign='center';c.textBaseline='middle';c.font=`900 ${cap.size}px system-ui,sans-serif`;c.shadowColor='#000a';c.shadowBlur=7;c.fillText(cap.text,cap.x,cap.y,target.width-24);c.restore()}function photoRect(p){return{x:p.x-p.w*p.scale/2,y:p.y-p.h*p.scale/2,w:p.w*p.scale,h:p.h*p.scale}}function paintPhoto(target,p,img){if(!p||!img)return;const c=target.getContext('2d'),r=photoRect(p),z=p.zoom||1,sw=img.naturalWidth/z,sh=img.naturalHeight/z,sx=(img.naturalWidth-sw)/2,sy=(img.naturalHeight-sh)/2;c.save();c.drawImage(img,sx,sy,sw,sh,r.x,r.y,r.w,r.h);c.restore()}function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(base,0,0);const f=frames[current];if(f){paintPhoto(canvas,f.photo,photoImage);paintCaption(canvas,f.caption)}}function save(){if(frames.length)frames[current].src=base.toDataURL('image/png')}function load(src){return new Promise((ok,no)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=src})}async function show(n){if(!frames[n])return;const f=frames[n],i=await load(f.src);bc.clearRect(0,0,base.width,base.height);bc.drawImage(i,0,0,base.width,base.height);photoImage=f.photo?await load(f.photo.src):null;redraw();syncTools()}function syncTools(){const p=frames[current]?.photo;$('imageTools').hidden=!p;if(p){$('imageSize').value=Math.round(p.scale*100);$('imageCrop').value=Math.round(p.zoom*100);$('sizeValue').textContent=Math.round(p.scale*100)+'%';$('cropValue').textContent=Math.round(p.zoom*100)+'%'}}function composite(f,img){const t=document.createElement('canvas');t.width=canvas.width;t.height=canvas.height;t.getContext('2d').drawImage(base,0,0);paintPhoto(t,f.photo,img);paintCaption(t,f.caption);return t}async function thumbs(){framesEl.replaceChildren();frames.forEach((f,n)=>{const b=document.createElement('button');b.type='button';b.className='frame'+(n===current?' active':'');b.setAttribute('aria-label',`Edit frame ${n+1}`);const t=document.createElement('canvas');t.width=t.height=76;const im=new Image;im.onload=async()=>{const bg=await load(f.src);const tmp=document.createElement('canvas');tmp.width=tmp.height=76;tmp.getContext('2d').drawImage(bg,0,0,76,76);const pi=f.photo?await load(f.photo.src):null;paintPhoto(tmp,f.photo,pi);paintCaption(tmp,f.caption);t.getContext('2d').drawImage(tmp,0,0)};im.src=f.src;b.append(t);b.onclick=async()=>{save();current=n;await show(n);thumbs()};framesEl.append(b)})}function addFrame(){save();frames.splice(current+1,0,frames[current]?{src:frames[current].src,photo:frames[current].photo?{...frames[current].photo}:null,caption:frames[current].caption?{...frames[current].caption}:null}:freshFrame());current++;redraw();syncTools();thumbs()}
$('addFrame').onclick=addFrame;$('duplicate').onclick=()=>addFrame();$('delete').onclick=async()=>{if(!frames.length)return;frames.splice(current,1);current=Math.max(0,Math.min(current,frames.length-1));if(frames.length)await show(current);else{bc.fillStyle=$('background').value;bc.fillRect(0,0,base.width,base.height);photoImage=null;redraw();syncTools()}thumbs()};$('background').oninput=()=>{bc.fillStyle=$('background').value;bc.fillRect(0,0,base.width,base.height);save();redraw();thumbs()};$('upload').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader;reader.onload=async()=>{try{photoImage=await load(reader.result);const factor=Math.min(1,(canvas.width*.72)/photoImage.naturalWidth,(canvas.height*.72)/photoImage.naturalHeight);if(!frames.length)frames.push(freshFrame());frames[current].photo={src:reader.result,x:canvas.width/2,y:canvas.height/2,w:photoImage.naturalWidth*factor,h:photoImage.naturalHeight*factor,scale:1,zoom:1};redraw();syncTools();thumbs();status.textContent='Image added. Drag it to move; use Size and Crop / zoom controls.'}catch{status.textContent='Could not load image.'}};reader.readAsDataURL(f);e.target.value=''};
$('imageSize').oninput=()=>{const p=frames[current]?.photo;if(!p)return;p.scale=Number($('imageSize').value)/100;$('sizeValue').textContent=$('imageSize').value+'%';redraw();thumbs()};$('imageCrop').oninput=()=>{const p=frames[current]?.photo;if(!p)return;p.zoom=Number($('imageCrop').value)/100;$('cropValue').textContent=$('imageCrop').value+'%';redraw();thumbs()};$('resetImage').onclick=()=>{const p=frames[current]?.photo;if(!p)return;p.scale=1;p.zoom=1;p.x=canvas.width/2;p.y=canvas.height/2;syncTools();redraw();thumbs()};$('removeImage').onclick=()=>{if(!frames[current])return;frames[current].photo=null;photoImage=null;redraw();syncTools();thumbs()};$('addText').onclick=()=>{const text=$('caption').value.trim();if(!text){status.textContent='Type a caption first.';return}if(!frames.length)frames.push(freshFrame());frames[current].caption={text,x:canvas.width/2,y:canvas.height/2,color:$('textColor').value,size:Math.max(10,Math.min(180,Number($('textSize').value)||56))};redraw();thumbs();status.textContent='Caption added. Drag it on the canvas to move it.'};
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}function hitCaption(p,c){return c&&Math.abs(p.x-c.x)<canvas.width*.48&&Math.abs(p.y-c.y)<c.size}canvas.addEventListener('pointerdown',e=>{const f=frames[current];if(!f)return;const p=point(e),r=f.photo&&photoImage?photoRect(f.photo):null;if(r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){drag={type:'photo',dx:f.photo.x-p.x,dy:f.photo.y-p.y};$('imageTools').hidden=false}else if(hitCaption(p,f.caption)){drag={type:'caption',dx:f.caption.x-p.x,dy:f.caption.y-p.y}}else if(f.caption){f.caption.x=p.x;f.caption.y=p.y;drag={type:'caption',dx:0,dy:0}}else return;canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId);e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),f=frames[current];if(drag.type==='photo'){f.photo.x=p.x+drag.dx;f.photo.y=p.y+drag.dy}else{f.caption.x=Math.max(0,Math.min(canvas.width,p.x+drag.dx));f.caption.y=Math.max(0,Math.min(canvas.height,p.y+drag.dy))}redraw()});function stop(){if(!drag)return;drag=null;canvas.classList.remove('dragging');save();thumbs()}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);
$('width').onchange=$('height').onchange=async()=>{save();const src=base.toDataURL(),w=Math.max(80,Math.min(800,Number($('width').value)||500)),h=Math.max(80,Math.min(800,Number($('height').value)||500));canvas.width=base.width=w;canvas.height=base.height=h;const i=await load(src);bc.drawImage(i,0,0,w,h);if(frames[current]?.caption){frames[current].caption.x=w/2;frames[current].caption.y=h/2}if(frames[current]?.photo){frames[current].photo.x=w/2;frames[current].photo.y=h/2}save();redraw();thumbs()};$('render').onclick=async()=>{save();if(!frames.length)frames.push(freshFrame());if(!window.GIF){status.textContent='GIF encoder failed to load. Reload the page.';return}const button=$('render');button.disabled=true;status.textContent='Rendering GIF…';try{if(out)URL.revokeObjectURL(out);const g=new GIF({workers:2,quality:10,width:canvas.width,height:canvas.height,workerScript:'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'});for(const f of frames){const bg=await load(f.src),pi=f.photo?await load(f.photo.src):null,t=document.createElement('canvas');t.width=canvas.width;t.height=canvas.height;t.getContext('2d').drawImage(bg,0,0);paintPhoto(t,f.photo,pi);paintCaption(t,f.caption);g.addFrame(t,{copy:true,delay:Math.max(50,Math.min(3000,Number($('delay').value)||250))})}g.on('finished',blob=>{out=URL.createObjectURL(blob);const im=new Image;im.src=out;im.alt='Generated GIF';$('preview').replaceChildren(im);const d=$('download');d.href=out;d.style.pointerEvents='auto';d.style.opacity=1;status.textContent='GIF ready!';button.disabled=false});g.render()}catch(error){status.textContent='Could not render GIF. Try smaller frames.';button.disabled=false}};
bc.fillStyle=$('background').value;bc.fillRect(0,0,base.width,base.height);frames.push(freshFrame());redraw();syncTools();thumbs()})();
</script></body></html>
