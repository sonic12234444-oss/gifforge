<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <title>GifForge — Make a GIF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#090b12;--panel:#141826;--panel2:#1b2033;--text:#f6f7fb;--muted:#aab2c5;--accent:#9c7cff;--green:#64e3a6;--border:rgba(255,255,255,.1)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,rgba(156,124,255,.18),transparent 25%),radial-gradient(circle at 85% 25%,rgba(100,227,166,.1),transparent 22%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
    button,input,textarea{font:inherit}button{border:0;border-radius:9px;padding:10px 13px;background:var(--accent);color:white;font-weight:750;cursor:pointer}button.secondary{background:var(--panel2);border:1px solid var(--border)}button:disabled{opacity:.55;cursor:wait}.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--border);background:rgba(9,11,18,.8);position:sticky;top:0;z-index:2;backdrop-filter:blur(12px)}.brand{font-size:1.25rem;font-weight:900}.brand span{color:var(--accent)}
    .layout{display:grid;grid-template-columns:260px minmax(280px,1fr) 250px;min-height:calc(100vh - 66px)}aside,.workspace{padding:18px}aside{border-right:1px solid var(--border)}aside.right{border-right:0;border-left:1px solid var(--border)}.title{margin:3px 0 13px;color:var(--muted);font-size:.77rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800}.control{display:grid;gap:6px;margin-bottom:13px}.control label{color:var(--muted);font-size:.86rem}input[type=text],input[type=number],input[type=color],input[type=file],textarea{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);padding:9px}input[type=color]{height:40px;padding:3px}textarea{min-height:65px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{width:100%}.stage{min-height:450px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--border);border-radius:15px;background-color:#10121b;background-image:linear-gradient(45deg,#171a26 25%,transparent 25%),linear-gradient(-45deg,#171a26 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#171a26 75%),linear-gradient(-45deg,transparent 75%,#171a26 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}#canvas{max-width:100%;max-height:70vh;background:white;box-shadow:0 20px 50px #0008}.frames{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.frame{flex:0 0 76px;height:76px;padding:0;background:#111;border:2px solid transparent;border-radius:8px;overflow:hidden}.frame.active{border-color:var(--accent)}.frame canvas{width:100%;height:100%;object-fit:cover}.preview{min-height:180px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--border);border-radius:10px;background:#090a10;color:var(--muted);margin:10px 0}.preview img{max-width:100%;max-height:300px}.status{min-height:24px;color:var(--muted);font-size:.85rem}.hint{color:var(--muted);font-size:.8rem}
    @media(max-width:950px){.layout{grid-template-columns:230px minmax(260px,1fr)}aside.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:12px}.right .title,.right .preview,.right .status{grid-column:1/-1}}
    @media(max-width:650px){.layout{display:flex;flex-direction:column}.layout aside{border-right:0;border-bottom:1px solid var(--border)}aside.right{display:block}.workspace{order:2}.stage{min-height:320px}.topbar{padding:0 14px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">Gif<span>Forge</span></div><button id="render">Render GIF</button></header>
  <div class="layout">
    <aside>
      <div class="title">Canvas</div>
      <div class="row">
        <div class="control"><label for="width">Width</label><input id="width" type="number" min="80" max="800" value="500"></div>
        <div class="control"><label for="height">Height</label><input id="height" type="number" min="80" max="800" value="500"></div>
      </div>
      <div class="control"><label for="background">Background</label><input id="background" type="color" value="#6c5ce7"></div>
      <div class="control"><label for="upload">Add image</label><input id="upload" type="file" accept="image/*"></div>
      <div class="title" style="margin-top:22px">Caption</div>
      <div class="control"><label for="caption">Text</label><textarea id="caption" placeholder="Type a caption"></textarea></div>
      <div class="row">
        <div class="control"><label for="textColor">Text color</label><input id="textColor" type="color" value="#ffffff"></div>
        <div class="control"><label for="textSize">Size</label><input id="textSize" type="number" min="10" max="180" value="56"></div>
      </div>
      <button id="addText" class="secondary full">Add caption</button>
    </aside>
    <main class="workspace">
      <div class="stage"><canvas id="canvas" width="500" height="500"></canvas></div>
      <div id="frames" class="frames" aria-label="Animation frames"></div>
      <div class="hint">Click a frame to edit it. Add frames to make your animation.</div>
    </main>
    <aside class="right">
      <div class="title">Animation</div>
      <div class="control"><label for="delay">Frame delay (ms)</label><input id="delay" type="number" min="50" max="3000" value="250"></div>
      <button id="addFrame" class="full">Add frame</button>
      <div class="row" style="margin-top:9px"><button id="duplicate" class="secondary">Duplicate</button><button id="delete" class="secondary">Delete</button></div>
      <div class="title" style="margin-top:20px">GIF preview</div>
      <div id="preview" class="preview">Render a GIF to preview it</div>
      <a id="download" class="button secondary full" href="#" download="gifforge.gif" style="display:block;text-align:center;pointer-events:none;opacity:.5">Download GIF</a>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="hint">Images stay in your browser. Rendering uses the gif.js library via CDN.</p>
    </aside>
  </div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('canvas'), ctx = canvas.getContext('2d');
  const framesEl = $('frames'), status = $('status');
  let frames = [], current = 0, outputUrl = null;

  function drawBackground() {
    ctx.fillStyle = $('background').value;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  function snapshot() { return canvas.toDataURL('image/png'); }
  function saveCurrent() { if (frames.length) frames[current] = snapshot(); }
  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = src;
    });
  }
  async function showFrame(index) {
    if (!frames[index]) return;
    const image = await loadImage(frames[index]);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(image, 0, 0);
  }
  function renderFrames() {
    framesEl.replaceChildren();
    frames.forEach((src, index) => {
      const button = document.createElement('button');
      button.className = 'frame' + (index === current ? ' active' : '');
      button.type = 'button';
      button.setAttribute('aria-label', `Edit frame ${index + 1}`);
      const thumb = document.createElement('canvas');
      thumb.width = 76; thumb.height = 76;
      const image = new Image();
      image.onload = () => thumb.getContext('2d').drawImage(image, 0, 0, 76, 76);
      image.src = src;
      button.append(thumb);
      button.addEventListener('click', async () => {
        saveCurrent(); current = index; await showFrame(current); renderFrames();
      });
      framesEl.append(button);
    });
  }
  function addFrame() {
    saveCurrent();
    if (!frames.length) { drawBackground(); frames.push(snapshot()); current = 0; }
    else { frames.splice(current + 1, 0, snapshot()); current++; }
    renderFrames();
  }
  $('addFrame').addEventListener('click', addFrame);
  $('duplicate').addEventListener('click', () => {
    if (!frames.length) return addFrame();
    saveCurrent(); frames.splice(current + 1, 0, frames[current]); current++;
    showFrame(current); renderFrames();
  });
  $('delete').addEventListener('click', async () => {
    if (!frames.length) return;
    frames.splice(current, 1);
    current = Math.max(0, Math.min(current, frames.length - 1));
    if (frames.length) await showFrame(current); else drawBackground();
    renderFrames();
  });
  $('background').addEventListener('input', () => {
    if (!frames.length) drawBackground();
  });
  async function resize() {
    saveCurrent();
    const w = Math.max(80, Math.min(800, Number($('width').value) || 500));
    const h = Math.max(80, Math.min(800, Number($('height').value) || 500));
    const previous = frames[current];
    canvas.width = w; canvas.height = h; drawBackground();
    if (previous) {
      const image = await loadImage(previous);
      ctx.drawImage(image, 0, 0, w, h);
      saveCurrent();
    }
    renderFrames();
  }
  $('width').addEventListener('change', resize);
  $('height').addEventListener('change', resize);
  $('upload').addEventListener('change', event => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const image = await loadImage(reader.result);
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        if (!frames.length) { frames.push(snapshot()); current = 0; }
        else saveCurrent();
        renderFrames();
      } catch { status.textContent = 'Could not load that image.'; }
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  });
  $('addText').addEventListener('click', () => {
    const text = $('caption').value.trim();
    if (!text) { status.textContent = 'Type a caption first.'; return; }
    if (!frames.length) { drawBackground(); frames.push(snapshot()); current = 0; }
    ctx.save();
    ctx.fillStyle = $('textColor').value;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${Math.max(10, Math.min(180, Number($('textSize').value) || 56))}px system-ui, sans-serif`;
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 7; ctx.shadowOffsetY = 3;
    ctx.fillText(text, canvas.width / 2, canvas.height / 2, canvas.width - 24);
    ctx.restore(); saveCurrent(); renderFrames(); status.textContent = 'Caption added to this frame.';
  });
  $('render').addEventListener('click', async () => {
    if (!window.GIF) { status.textContent = 'GIF encoder did not load. Check your internet connection and reload.'; return; }
    saveCurrent();
    if (!frames.length) { drawBackground(); frames.push(snapshot()); current = 0; renderFrames(); }
    const renderButton = $('render'); renderButton.disabled = true;
    $('download').style.pointerEvents = 'none'; $('download').style.opacity = '.5';
    status.textContent = 'Rendering GIF…';
    try {
      if (outputUrl) URL.revokeObjectURL(outputUrl);
      const gif = new GIF({workers: 2, quality: 10, width: canvas.width, height: canvas.height, workerScript: 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'});
      for (const src of frames) gif.addFrame(await loadImage(src), {copy: true, delay: Math.max(50, Math.min(3000, Number($('delay').value) || 250))});
      gif.on('finished', blob => {
        outputUrl = URL.createObjectURL(blob);
        $('preview').replaceChildren();
        const image = new Image(); image.alt = 'Generated animated GIF'; image.src = outputUrl; $('preview').append(image);
        const link = $('download'); link.href = outputUrl; link.style.pointerEvents = 'auto'; link.style.opacity = '1';
        status.textContent = `Done — ${frames.length} frame${frames.length === 1 ? '' : 's'}.`;
        renderButton.disabled = false;
      });
      gif.on('abort', () => { status.textContent = 'GIF rendering was cancelled.'; renderButton.disabled = false; });
      gif.render();
    } catch (error) {
      status.textContent = 'Could not render GIF. Try fewer or smaller frames.';
      renderButton.disabled = false;
    }
  });
  drawBackground(); frames.push(snapshot()); renderFrames();
})();
</script>
</body>
</html>
